<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azania Paragon Institute - Application Portal</title>
    
    <!-- Tailwind CSS (No Build) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (Compiles JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tech Portal Custom Styles & Animations -->
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.35; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.04); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        .animate-pulse-glow {
            animation: pulse-glow 3s ease-in-out infinite;
        }
        .tech-grid-pattern {
            background-image: radial-gradient(rgba(59, 130, 246, 0.15) 1px, transparent 1px),
                              linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 24px 24px, 40px 40px, 40px 40px;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.8);
            color: #f8fafc;
            transition: all 0.2s ease-in-out;
        }
        .glass-input:focus {
            background: rgba(30, 41, 59, 0.95);
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            outline: none;
        }
        /* Custom Scrollbar for T&C */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative font-sans antialiased selection:bg-blue-600 selection:text-white">
    
    <!-- Ambient Background Effects -->
    <div className="fixed inset-0 tech-grid-pattern opacity-40 pointer-events-none"></div>
    <div className="fixed top-0 left-1/4 w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div className="fixed bottom-0 right-1/4 w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        // SVG Icons
        const IconUser = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const IconGraduation = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.42 10.922a2 2 0 0 1-.019 3.836l-8.58 3.974a2 2 0 0 1-1.642 0l-8.58-3.974a2 2 0 0 1-.019-3.836l8.66-3.805a2 2 0 0 1 1.52 0l8.66 3.805z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>;
        const IconWallet = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a8 8 0 0 1-5 7.96V16a2 2 0 0 0-2-2h-3"/></svg>;
        const IconFile = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;

        const PROGRAMS = [
            { code: "#API-CDP-4402", name: "Certified Digital Practitioner: Digital Literacy Fundamentals" },
            { code: "#API-IOT-327", name: "Internet of Things (IoT) Fundamentals" },
            { code: "#API-SDF-4369", name: "Social Media and Digital Marketing Fundamentals" },
            { code: "#API-AFBP-209", name: "Artificial Intelligence Fundamentals and Basic Prompting" },
            { code: "#API-CLF-2398", name: "Cloud Computing Fundamentals" },
            { code: "#API-CSF-419", name: "Cyber Security Fundamentals" }
        ];

        function App() {
            const [step, setStep] = useState(0);
            const [agreedToTC, setAgreedToTC] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [uniqueID, setUniqueID] = useState("");
            const [formData, setFormData] = useState({
                program: "",
                firstName: "", lastName: "", idNumber: "", email: "", phone: "", address: "",
                instName: "", instCity: "", instProvince: "", highestQual: "",
                qualName: "", qualYear: "", qualDescription: "",
                grades: [{ subject: "", percentage: "", level: "" }],
                feePayerName: "", feePayerID: "", feePayerPhone: "", feePayerEmployment: "", affordabilityStatus: false,
                files: {}, consent1: false, consent2: false
            });

            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: type === 'checkbox' ? checked : value
                }));
            };

            const handleFileChange = (e) => {
                const { name, files } = e.target;
                setFormData(prev => ({
                    ...prev,
                    files: { ...prev.files, [name]: files[0] }
                }));
            };

            const updateGradeRow = (index, field, value) => {
                const newGrades = [...formData.grades];
                newGrades[index][field] = value;
                setFormData({ ...formData, grades: newGrades });
            };

            const generateAppId = () => {
                const randomStr = Math.random().toString(36).substring(2, 7).toUpperCase();
                return `AZP-${new Date().getFullYear()}-${randomStr}`;
            };

            const submitApplication = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                
                const appId = generateAppId();
                setUniqueID(appId);
                try {
                    const files = {};
                    for (const [name, file] of Object.entries(formData.files)) {
                        if (!file) continue;
                        files[name] = {
                            name: file.name,
                            type: file.type,
                            data: await new Promise((resolve, reject) => {
                                const reader = new FileReader();
                                reader.onload = () => resolve(String(reader.result).split(',')[1]);
                                reader.onerror = reject;
                                reader.readAsDataURL(file);
                            })
                        };
                    }
                    const response = await fetch('/api/applications', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            applicationId: appId,
                            applicationData: { ...formData, files: undefined },
                            files
                        })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || 'Submission failed');
                    setStep(5);
                } catch (error) {
                    alert(error.message || "Error submitting application. Please try again.");
                    setUniqueID("");
                }
                setIsSubmitting(false);
            };

            return (
                <div className="min-h-screen flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8 relative z-10">
                    <div className="max-w-4xl w-full glass-card rounded-2xl shadow-[0_20px_60px_rgba(0,0,0,0.6)] overflow-hidden border border-slate-800">
                        
                        <!-- ANIMATED HERO TECH HEADER -->
                        <div className="relative overflow-hidden bg-gradient-to-r from-slate-950 via-slate-900 to-indigo-950 border-b border-slate-800 p-8 sm:p-10 text-center text-white">
                            <!-- Glowing background lights -->
                            <div className="absolute inset-0 tech-grid-pattern opacity-30 pointer-events-none"></div>
                            <div className="absolute -top-20 -left-20 w-64 h-64 bg-blue-600/20 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>
                            <div className="absolute -bottom-20 -right-20 w-64 h-64 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none animate-pulse-glow" style={{ animationDelay: '1.5s' }}></div>

                            <div className="relative z-10 flex flex-col items-center justify-center">
                                <!-- Animated Header Banner Graphic -->
                                <div className="relative group mb-3">
                                    <div className="absolute -inset-1 bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 rounded-xl blur opacity-30 group-hover:opacity-60 transition duration-500"></div>
                                    <img 
                                        src="https://www.dropbox.com/scl/fi/y3lnyap2ryby8vgtd5j9j/file_0000000095f081f480a2d12930ec1f1c.png?rlkey=5olvwo4v9ngsodhny2dtu3u10&raw=1" 
                                        alt="Azania Paragon Institute Banner" 
                                        className="relative max-h-24 sm:max-h-28 object-contain filter drop-shadow-[0_0_20px_rgba(59,130,246,0.4)] animate-float"
                                    />
                                </div>

                                <div className="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-blue-950/80 border border-blue-500/30 text-blue-300 text-xs font-semibold tracking-wide uppercase mb-2 backdrop-blur-md shadow-inner">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 -ml-4"></span>
                                    <span>Admissions Portal &bull; Technical Pathways</span>
                                </div>
                                
                                <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-blue-200 bg-clip-text text-transparent">
                                    Azania Paragon Institute
                                </h1>
                                <p className="text-slate-400 max-w-lg mt-1 text-sm sm:text-base font-light">
                                    Empowering Next-Generation Digital Pioneers &amp; Technical Leaders
                                </p>
                            </div>
                        </div>

                        <div className="p-6 sm:p-10">
                            
                            {/* STEP 0: TERMS & CONDITIONS */}
                            {step === 0 && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-slate-100 border-b border-slate-800 pb-3 flex items-center justify-between">
                                        <span>Terms &amp; Conditions</span>
                                        <span className="text-xs font-normal text-slate-400 uppercase tracking-wider">Step 0 of 4</span>
                                    </h2>
                                    <div className="h-64 overflow-y-auto bg-slate-950/80 p-6 rounded-xl border border-slate-800 text-sm text-slate-300 space-y-4 custom-scrollbar leading-relaxed shadow-inner">
                                        <p><strong className="text-blue-400">1. SCOPE OF APPLICATION</strong><br/>By accepting these terms, you are applying for admission into the Azania Paragon Institute’s rigorous technical upskilling programs. This portal specifically processes applications for our specialized, standalone foundational tracks, which include the Certified Digital Practitioner: Digital Literacy Fundamentals, Internet of Things (IoT) Fundamentals, Social Media and Digital Marketing Fundamentals, Artificial Intelligence Fundamentals and Basic Prompting, Cloud Computing Fundamentals, and Cyber Security Fundamentals. These programs are designed as intensive educational pathways aimed at equipping you with globally relevant, high-demand technology skills, independent of our corporate-sponsored LaunchLab initiatives.</p>
                                        <p><strong className="text-blue-400">2. ACCURACY OF INFORMATION &amp; EVALUATION PROCESS</strong><br/>You formally declare that all personal details, academic records, and supporting documentation submitted through this portal are strictly accurate, authentic, and represent your own original work. API reserves the right to independently verify any information provided during or after the application phase. You acknowledge that the discovery of falsified, plagiarized, or misleading information will result in immediate disqualification and the permanent revocation of any admission offers. Furthermore, submitting an application does not guarantee admission; all candidates are subject to API’s comprehensive vetting framework, which may include baseline assessments, virtual interviews, and detailed evaluations by our Admissions Committee to ensure alignment with our academic standards.</p>
                                        <p><strong className="text-blue-400">3. CONDITIONAL OFFERS &amp; ENROLLMENT TIMELINES</strong><br/>Due to the highly competitive demand and subsidized nature of our tech programs, strict adherence to enrollment timelines is mandatory. Should you be selected and receive a formal Offer of Admission, you are required to formally accept and reserve your seat on the portal within a strict 72-hour window. Failure to confirm your acceptance within this timeframe will result in the immediate forfeiture of your seat, which will subsequently be released to a candidate on our waiting list. Upon acceptance, all successful candidates must also attend a mandatory Welcome &amp; Orientation event and successfully complete their onboarding onto the E-skolo learning management hub prior to the commencement of their academic track.</p>
                                        <p><strong className="text-blue-400">4. DATA PRIVACY &amp; POPIA COMPLIANCE</strong><br/>In strict compliance with the Protection of Personal Information Act (POPIA) of South Africa, you provide explicit consent for the Azania Paragon Institute to collect, process, and securely store your personal data for the purposes of academic evaluation, identity verification, and demographic reporting. While these foundational programs operate independently of our LaunchLab corporate placements, API may still share relevant academic profiles, assessment scores, and portfolios with verified academic partners, certification bodies, or future enterprise networks solely for the purpose of advancing your educational mobility and verifying your credentials.</p>
                                        <p><strong className="text-blue-400">5. ACADEMIC RIGOR, ETHICS, AND I.C.E. VALUES</strong><br/>Acceptance into an API program requires intense dedication, intellectual curiosity, and an unwavering commitment to our foundational values of Innovation, Community, and Excellence (I.C.E.). By applying, you commit to fully engaging with the rigorous curriculum, asynchronous learning modules, and proctored technical examinations required to successfully complete your chosen track. You agree to be bound by our strict institutional code of conduct; any form of academic dishonesty, harassment, or unprofessional behavior during the application phase or throughout the duration of your studies will lead to disciplinary action and the immediate termination of your enrollment.</p>
                                    </div>
                                    
                                    <div className="space-y-3 pt-2">
                                        <label className="flex items-start space-x-3 cursor-pointer group">
                                            <input type="checkbox" className="mt-1 w-5 h-5 text-blue-600 rounded bg-slate-800 border-slate-700 focus:ring-blue-500 focus:ring-offset-slate-900 cursor-pointer" checked={agreedToTC} onChange={(e) => setAgreedToTC(e.target.checked)} />
                                            <span className="text-slate-300 group-hover:text-white text-sm transition-colors font-medium">I confirm that I have read, understood, and agree to be bound by the Azania Paragon Institute Admissions Terms and Conditions outlined above.</span>
                                        </label>
                                        <label className="flex items-start space-x-3 cursor-pointer group">
                                            <input type="checkbox" className="mt-1 w-5 h-5 text-blue-600 rounded bg-slate-800 border-slate-700 focus:ring-blue-500 focus:ring-offset-slate-900 cursor-pointer" checked={agreedToTC} onChange={(e) => setAgreedToTC(e.target.checked)} />
                                            <span className="text-slate-300 group-hover:text-white text-sm transition-colors font-medium">I declare that all information and documentation I will provide during this application process is entirely true, accurate, and my own.</span>
                                        </label>
                                        <label className="flex items-start space-x-3 cursor-pointer group">
                                            <input type="checkbox" className="mt-1 w-5 h-5 text-blue-600 rounded bg-slate-800 border-slate-700 focus:ring-blue-500 focus:ring-offset-slate-900 cursor-pointer" checked={agreedToTC} onChange={(e) => setAgreedToTC(e.target.checked)} />
                                            <span className="text-slate-300 group-hover:text-white text-sm transition-colors font-medium">I consent to the processing of my personal information in accordance with the Protection of Personal Information Act (POPIA) for admissions, academic administration, and credential verification purposes.</span>
                                        </label>
                                        <label className="flex items-start space-x-3 cursor-pointer group">
                                            <input type="checkbox" className="mt-1 w-5 h-5 text-blue-600 rounded bg-slate-800 border-slate-700 focus:ring-blue-500 focus:ring-offset-slate-900 cursor-pointer" checked={agreedToTC} onChange={(e) => setAgreedToTC(e.target.checked)} />
                                            <span className="text-slate-300 group-hover:text-white text-sm transition-colors font-medium">I acknowledge that if I receive an Offer of Admission, I must accept the offer within the strict 72-hour window, failing which my seat will be released.</span>
                                        </label>
                                    </div>

                                    <button 
                                        disabled={!agreedToTC} 
                                        onClick={() => setStep(1)} 
                                        className={`w-full py-3.5 rounded-xl font-semibold text-white transition-all duration-300 shadow-lg ${
                                            agreedToTC 
                                            ? 'bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 shadow-blue-500/25 hover:shadow-blue-500/40 transform hover:-translate-y-0.5' 
                                            : 'bg-slate-800 text-slate-500 border border-slate-700/50 cursor-not-allowed'
                                        }`}
                                    >
                                        Proceed to Application
                                    </button>
                                </div>
                            )}

                            {/* STEPS 1-4 */}
                            {step > 0 && step < 5 && (
                                <form onSubmit={step === 4 ? submitApplication : (e) => { e.preventDefault(); setStep(step + 1); }}>
                                    
                                    <!-- PROGRESS STEPPER -->
                                    <div className="flex justify-between mb-10 relative">
                                        <div className="absolute top-1/2 left-0 w-full h-1 bg-slate-800 -z-10 -translate-y-1/2 rounded"></div>
                                        <div className="absolute top-1/2 left-0 h-1 bg-gradient-to-r from-blue-600 to-cyan-500 -z-10 -translate-y-1/2 rounded transition-all duration-500" style={{ width: `${((step - 1) / 3) * 100}%` }}></div>
                                        {[1,2,3,4].map((num) => (
                                            <div key={num} className={`w-11 h-11 rounded-xl flex items-center justify-center font-bold text-sm border-2 transition-all duration-300 ${
                                                step >= num 
                                                ? 'bg-gradient-to-br from-blue-600 to-cyan-500 border-blue-400 text-white shadow-[0_0_15px_rgba(59,130,246,0.5)]' 
                                                : 'bg-slate-900 border-slate-700 text-slate-500'
                                            }`}>
                                                {num}
                                            </div>
                                        ))}
                                    </div>

                                    {/* Section 1 */}
                                    {step === 1 && (
                                        <div className="space-y-6">
                                            <h2 className="text-xl font-bold flex items-center gap-2.5 text-slate-100">
                                                <span className="p-2 rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/20"><IconUser/></span> 
                                                Basic Information
                                            </h2>
                                            <div className="space-y-4">
                                                <div>
                                                    <label className="block text-sm font-medium text-slate-300 mb-1.5">Program Applying For *</label>
                                                    <select required name="program" value={formData.program} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-slate-100 text-sm shadow-sm">
                                                        <option value="" className="bg-slate-900 text-slate-100">-- Select a Program --</option>
                                                        {PROGRAMS.map(p => <option key={p.code} value={p.code} className="bg-slate-900 text-slate-100">{p.name} ({p.code})</option>)}
                                                    </select>
                                                </div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">First Name *</label><input required type="text" name="firstName" value={formData.firstName} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Last Name *</label><input required type="text" name="lastName" value={formData.lastName} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                </div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">ID / Passport Number *</label><input required type="text" name="idNumber" value={formData.idNumber} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Email Address *</label><input required type="email" name="email" value={formData.email} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                </div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Date of Birth *</label><input required type="date" name="dateOfBirth" value={formData.dateOfBirth} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Nationality *</label><input required type="text" name="nationality" value={formData.nationality} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                </div>
                                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Province *</label><input required type="text" name="province" value={formData.province} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">City &amp; Suburb *</label><input required type="text" name="citynsurburb" value={formData.citynsurburb} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Postal Code *</label><input required type="number" name="postalcode" value={formData.postalcode} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Street Name *</label><input required type="text" name="streetname" value={formData.streetname} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Section 2 */}
                                    {step === 2 && (
                                        <div className="space-y-6">
                                            <h2 className="text-xl font-bold flex items-center gap-2.5 text-slate-100">
                                                <span className="p-2 rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/20"><IconGraduation/></span> 
                                                Educational Information
                                            </h2>
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                                <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Institution Name</label><input required type="text" name="instName" value={formData.instName} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                <div><label className="block text-sm font-medium text-slate-300 mb-1.5">City</label><input required type="text" name="instCity" value={formData.instCity} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Province</label><input required type="text" name="instProvince" value={formData.instProvince} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-300 mb-1.5">Highest Qualification *</label>
                                                <select required name="highestQual" value={formData.highestQual} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm">
                                                    <option value="" className="bg-slate-900 text-slate-100">-- Select Qualification --</option>
                                                    <option value="Certificate" className="bg-slate-900 text-slate-100">Certificate</option>
                                                    <option value="Diploma" className="bg-slate-900 text-slate-100">Diploma</option>
                                                    <option value="Bachelors" className="bg-slate-900 text-slate-100">Bachelors</option>
                                                    <option value="Masters" className="bg-slate-900 text-slate-100">Masters</option>
                                                    <option value="Grade 10" className="bg-slate-900 text-slate-100">Grade 10</option>
                                                    <option value="Grade 11" className="bg-slate-900 text-slate-100">Grade 11</option>
                                                    <option value="Grade 12" className="bg-slate-900 text-slate-100">Grade 12</option>
                                                </select>
                                            </div>
                                            {['Certificate', 'Diploma', 'Bachelors', 'Masters'].includes(formData.highestQual) && (
                                                <div className="bg-blue-950/30 p-6 rounded-xl border border-blue-500/20 backdrop-blur-sm space-y-4">
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                        <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Qualification Name</label><input required type="text" name="qualName" value={formData.qualName} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                        <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Year Obtained</label><input required type="number" name="qualYear" value={formData.qualYear} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                    </div>
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Description (Modules)</label><textarea required name="qualDescription" value={formData.qualDescription} onChange={handleInputChange} rows="3" className="w-full p-3 rounded-xl glass-input text-sm"></textarea></div>
                                                </div>
                                            )}
                                            {['Grade 10', 'Grade 11', 'Grade 12'].includes(formData.highestQual) && (
                                                <div className="space-y-4 border border-slate-800 rounded-xl overflow-hidden bg-slate-950/50">
                                                    <div className="bg-slate-900 px-5 py-3.5 border-b border-slate-800 font-medium text-slate-200 flex justify-between items-center">
                                                        <span>Report Card Results</span>
                                                        <button type="button" onClick={() => setFormData({...formData, grades: [...formData.grades, {subject:'', percentage:'', level:''}]})} className="text-xs bg-slate-800 hover:bg-slate-700 text-blue-300 border border-slate-700 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors font-medium"><IconPlus/> Add Subject</button>
                                                    </div>
                                                    <table className="min-w-full divide-y divide-slate-800">
                                                        <thead className="bg-slate-950">
                                                            <tr>
                                                                <th className="px-6 py-3 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Learning Area</th>
                                                                <th className="px-6 py-3 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">%</th>
                                                                <th className="px-6 py-3 text-left text-xs font-semibold text-slate-400 uppercase tracking-wider">Level (1-7)</th>
                                                                <th></th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-slate-800 bg-slate-900/40">
                                                            {formData.grades.map((row, idx) => (
                                                                <tr key={idx}>
                                                                    <td className="px-4 py-2"><input required type="text" value={row.subject} onChange={e => updateGradeRow(idx, 'subject', e.target.value)} placeholder="Subject" className="w-full p-2 rounded-lg glass-input text-sm" /></td>
                                                                    <td className="px-4 py-2"><input required type="number" value={row.percentage} onChange={e => updateGradeRow(idx, 'percentage', e.target.value)} placeholder="%" className="w-full p-2 rounded-lg glass-input text-sm" /></td>
                                                                    <td className="px-4 py-2"><input required type="number" min="1" max="7" value={row.level} onChange={e => updateGradeRow(idx, 'level', e.target.value)} placeholder="1-7" className="w-full p-2 rounded-lg glass-input text-sm" /></td>
                                                                    <td className="px-4 py-2">
                                                                        {idx > 0 && <button type="button" onClick={() => setFormData({...formData, grades: formData.grades.filter((_, i) => i !== idx)})} className="text-rose-400 hover:text-rose-300 transition-colors p-1.5 hover:bg-rose-500/10 rounded-lg"><IconTrash/></button>}
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Section 3 */}
                                    {step === 3 && (
                                        <div className="space-y-6">
                                            <h2 className="text-xl font-bold flex items-center gap-2.5 text-slate-100">
                                                <span className="p-2 rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/20"><IconWallet/></span> 
                                                Financial Information
                                            </h2>
                                            <div className="bg-slate-900/60 border border-slate-800 p-6 rounded-xl space-y-4 shadow-sm backdrop-blur-sm">
                                                <h3 className="font-semibold text-slate-200">Person Responsible for Fees</h3>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">Full Name</label><input required type="text" name="feePayerName" value={formData.feePayerName} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                    <div><label className="block text-sm font-medium text-slate-300 mb-1.5">ID Number</label><input required type="text" name="feePayerID" value={formData.feePayerID} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm" /></div>
                                                </div>
                                                <div className="pt-4 border-t border-slate-800">
                                                    <h3 className="font-semibold text-slate-200 mb-3">Affordability Assessment</h3>
                                                    <label className="block text-sm font-medium text-slate-300 mb-1.5">Employment Status</label>
                                                    <select required name="feePayerEmployment" value={formData.feePayerEmployment} onChange={handleInputChange} className="w-full p-3 rounded-xl glass-input text-sm">
                                                        <option value="" className="bg-slate-900 text-slate-100">-- Select Status --</option>
                                                        <option value="Employed" className="bg-slate-900 text-slate-100">Employed</option>
                                                        <option value="Self-Employed" className="bg-slate-900 text-slate-100">Self-Employed</option>
                                                        <option value="Unemployed" className="bg-slate-900 text-slate-100">Unemployed</option>
                                                    </select>
                                                    <div className="mt-4 p-4 bg-amber-950/30 text-amber-200 rounded-xl border border-amber-500/30 backdrop-blur-sm shadow-sm">
                                                        <label className="flex items-start space-x-3 cursor-pointer">
                                                            <input required type="checkbox" name="affordabilityStatus" checked={formData.affordabilityStatus} onChange={handleInputChange} className="mt-1 w-5 h-5 text-blue-600 rounded bg-slate-800 border-slate-700 focus:ring-blue-500 focus:ring-offset-slate-900 cursor-pointer" />
                                                            <span className="text-sm font-medium">I confirm that the designated fee payer possesses the financial capacity to settle all study fees.</span>
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Section 4 */}
                                    {step === 4 && (
                                        <div className="space-y-6">
                                            <h2 className="text-xl font-bold flex items-center gap-2.5 text-slate-100">
                                                <span className="p-2 rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/20"><IconFile/></span> 
                                                Documents &amp; Final Consents
                                            </h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900/50 p-6 rounded-xl border border-slate-800">
                                                <div>
                                                    <label className="block text-sm font-bold text-slate-300 mb-1">Certified Results (PDF/JPEG) *</label>
                                                    <input required type="file" name="certReportCard" accept=".pdf,.png,.jpeg,.jpg" onChange={handleFileChange} className="w-full text-xs text-slate-400 glass-input p-2 rounded-xl file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600/20 file:text-blue-300 hover:file:bg-blue-600/30"/>
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-bold text-slate-300 mb-1">Certified ID / Birth Cert *</label>
                                                    <input required type="file" name="certID" accept=".pdf,.png,.jpeg,.jpg" onChange={handleFileChange} className="w-full text-xs text-slate-400 glass-input p-2 rounded-xl file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600/20 file:text-blue-300 hover:file:bg-blue-600/30"/>
                                                </div>
                                                <div>
                                                    <label className="block text-sm font-bold text-slate-300 mb-1">Proof of Residence *</label>
                                                    <input required type="file" name="proofOfRes" accept=".pdf,.png,.jpeg,.jpg" onChange={handleFileChange} className="w-full text-xs text-slate-400 glass-input p-2 rounded-xl file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600/20 file:text-blue-300 hover:file:bg-blue-600/30"/>
                                                </div>
                                                
                                                {['Grade 10', 'Grade 11', 'Grade 12'].includes(formData.highestQual) && (
                                                    <div className="bg-amber-950/30 p-4 rounded-xl border border-amber-500/30">
                                                        <label className="block text-sm font-bold text-amber-200 mb-0.5">Parent/Guardian ID *</label>
                                                        <p className="text-xs text-amber-400/80 mb-2">Required because a Grade was selected.</p>
                                                        <input required type="file" name="parentID" accept=".pdf,.png,.jpeg,.jpg" onChange={handleFileChange} className="w-full text-xs text-slate-400 glass-input p-2 rounded-xl file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500/20 file:text-amber-300 hover:file:bg-amber-500/30"/>
                                                    </div>
                                                )}
                                            </div>
                                            <div className="space-y-3 pt-4 border-t border-slate-800">
                                                <label className="flex items-start space-x-3 cursor-pointer group">
                                                    <input required type="checkbox" name="consent1" checked={formData.consent1} onChange={handleInputChange} className="mt-1 w-5 h-5 text-blue-600 rounded bg-slate-800 border-slate-700 focus:ring-blue-500 focus:ring-offset-slate-900 cursor-pointer" />
                                                    <span className="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">I declare that all information provided is true and accurate.</span>
                                                </label>
                                                <label className="flex items-start space-x-3 cursor-pointer group">
                                                    <input required type="checkbox" name="consent2" checked={formData.consent2} onChange={handleInputChange} className="mt-1 w-5 h-5 text-blue-600 rounded bg-slate-800 border-slate-700 focus:ring-blue-500 focus:ring-offset-slate-900 cursor-pointer" />
                                                    <span className="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">I consent to the Institute validating my educational results.</span>
                                                </label>
                                            </div>
                                        </div>
                                    )}

                                    {/* Footer Nav Buttons */}
                                    <div className="mt-10 flex justify-between pt-6 border-t border-slate-800">
                                        <button type="button" onClick={() => setStep(step - 1)} className="px-6 py-2.5 rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-800 hover:text-white font-medium transition-all duration-200">Back</button>
                                        <button 
                                            type="submit" 
                                            disabled={isSubmitting} 
                                            className="px-8 py-2.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white rounded-xl font-medium shadow-lg hover:shadow-blue-500/25 transition-all transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            {isSubmitting ? 'Processing...' : step === 4 ? 'Submit Application' : 'Next Step'}
                                        </button>
                                    </div>
                                </form>
                            )}

                            {/* STEP 5: SUCCESS */}
                            {step === 5 && (
                                <div className="text-center py-12">
                                    <div className="inline-flex items-center justify-center w-20 h-20 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 mb-6 shadow-[0_0_30px_rgba(16,185,129,0.2)] animate-pulse-glow">
                                        <IconCheck/>
                                    </div>
                                    <h2 className="text-3xl font-extrabold text-slate-100 mb-3 bg-gradient-to-r from-white via-slate-100 to-emerald-200 bg-clip-text text-transparent">Application Received!</h2>
                                    <p className="text-slate-400 mb-6 max-w-md mx-auto text-sm sm:text-base">Thank you for applying to Azania Paragon Institute. A confirmation email has been sent.</p>
                                    <div className="bg-slate-950/80 rounded-2xl p-6 inline-block mb-8 border border-slate-800 shadow-xl backdrop-blur-md">
                                        <p className="text-xs text-slate-400 uppercase tracking-widest mb-1 font-semibold">Your Unique Tracking ID:</p>
                                        <p className="text-2xl font-mono font-bold text-cyan-400 tracking-wider">{uniqueID}</p>
                                    </div>
                                    <div>
                                        <button onClick={() => window.location.reload()} className="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-blue-400 rounded-xl border border-slate-700 font-medium transition-colors text-sm">Submit another application</button>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
